name: Pressers v2 caption probe

# Shows exactly why (or whether) YouTube captions can be fetched from GitHub's
# runners. No secrets, no Gemini calls, nothing committed.
on:
  pull_request:
    paths:
      - 'pressers_v2/probe_captions.py'
      - '.github/workflows/pressers-v2-caption-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r pressers_v2/requirements.txt
      - run: pip list 2>/dev/null | grep -i youtube-transcript
      - run: python pressers_v2/probe_captions.py
