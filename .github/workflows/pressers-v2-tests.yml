name: Pressers v2 tests

# Offline unit tests (Gemini mocked, no network, no secrets), on Linux and on
# a real Windows filesystem (the clip tool's file moves, deletes and folder
# check behave differently there).
on:
  pull_request:
    paths:
      - 'pressers_v2/**'
      - 'docs/presser-clips/**'
      - '.github/workflows/pressers-v2-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r pressers_v2/requirements.txt
      - run: python -m unittest discover -s pressers_v2/tests -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - run: pip install -r pressers_v2/requirements.txt
      - name: Windows filesystem checks (folder check, render and move, cleanup)
        env:
          REQUIRE_FFMPEG: '1'
        run: python -m unittest discover -s pressers_v2/tests -p test_windows_fs.py -v
      - name: Installer setup step with typed answers (C:\presser-clips-ci-setup)
        shell: bash
        run: |
          printf 'C:\\presser-clips-ci-setup\n7\nVS\nN\n' | python pressers_v2/presser_clips_setup.py --setup
          python - <<'EOF'
          import json, os
          s = json.load(open("pressers_v2/settings.json", encoding="utf-8"))
          print(s)
          assert s["out_dir"].lower() == r"c:\presser-clips-ci-setup", s
          assert (s["keep_days"], s["formats"], s["auto_run"]) == (7, ["vertical", "square"], False), s
          assert os.listdir(r"C:\presser-clips-ci-setup") == [], "the folder check left a file behind"
          EOF
          rm pressers_v2/settings.json   # the unit tests expect no installed settings
      - name: Full test suite on Windows
        run: python -m unittest discover -s pressers_v2/tests -v
