name: TEMPORARY strict presser quotes dry run (prints a report, writes nothing; removed before merge)
on:
  push:
    branches: [claude/zen-volta-eqkplv]
    paths: ['pressers_v2/strict_quotes.py', '.github/workflows/strict-dryrun.yml']
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r pressers_v2/requirements.txt
      - name: Known people (exact names) from the nba-headshots player list and the quotes-lab people list
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/jsierrahoopshype/nba-headshots "$RUNNER_TEMP/headshots"
          git -C "$RUNNER_TEMP/headshots" sparse-checkout set --no-cone /players/metadata/players_all.json
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/duo.json" "https://jsierrahoopshype.github.io/nba-quotes/quotes/duo.json" || echo '{}' > "$RUNNER_TEMP/duo.json"
      - name: Dry run (speaker named in title/description, subjects said in the quote, verbatim check)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pressers_v2/strict_quotes.py --dry-run --headshots "$RUNNER_TEMP/headshots" --people "$RUNNER_TEMP/duo.json"
