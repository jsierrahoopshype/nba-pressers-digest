name: Pressers v2 (quotes + clips)
# Run titles let the overnight chain tell overnight runs apart (tools/overnight_chain.py).
run-name: ${{ inputs.chain == 'true' && 'Pressers v2 overnight chain' || (inputs.chain_check == 'true' && 'Pressers v2 chain permission check') || (github.event_name == 'schedule' && format('Pressers v2 schedule {0}', github.event.schedule)) || 'Pressers v2 (quotes + clips)' }}

# The current pipeline (the original scripts/ pipeline's workflow has been removed).
on:
  schedule:
    # Overnight drip, one trigger every hour 01:23-10:23 UTC (9 PM-6 AM ET
    # in winter). GitHub starts scheduled runs 2-7 hours late on this repo
    # (the old single 06:15 trigger landed at 11:00-13:00 UTC, i.e. 7-9 AM
    # ET), so a single overnight trigger never caught postgame pressers in
    # time. Ten triggers give a steady stream of runs through the night; each
    # one only processes videos not yet on disk, so Gemini spend is unchanged.
    # All of them share the "overnight" slot (one digest-overnight.md, one
    # run_id per night). Slack: one post per night, from the first run that
    # starts at or after 10:00 UTC (any slot; see pressers_v2/slack_state.py).
    - cron: '23 1-10 * * *'
    - cron: '15 14 * * *'  # 14:15 UTC: morning shootaround / practice availabilities
    - cron: '15 20 * * *'  # 20:15 UTC: afternoon availabilities + early pregame
  workflow_dispatch:
    inputs:
      extra_videos:
        description: "Optional: YouTube URLs to also process (one per line or comma-separated)"
        required: false
        type: string
      force:
        description: "Reprocess the extra_videos URLs even if already processed (overwrites their output)"
        required: false
        type: boolean
        default: false
      rebuild_dates:
        description: "Optional: rebuild these days' pages instead of a normal run (e.g. 2026-11-09). No video is sent to Gemini."
        required: false
        type: string
      chain:
        description: "Internal: set by the overnight chain (a run started by the previous overnight run)"
        required: false
        type: string
        default: ""
      chain_failures:
        description: "Internal: failed overnight runs in a row so far"
        required: false
        type: string
        default: "0"
      chain_check:
        description: "Only check that the built-in token may start the next overnight run (starts nothing)"
        required: false
        type: string
        default: ""

jobs:
  # Every run passes here. A run the overnight chain started first waits
  # ~50 min, then extracts only before 10:00 UTC; a permission check
  # extracts nothing.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      go: ${{ steps.plain.outputs.go || steps.chain.outputs.go }}
    steps:
      - id: plain
        if: inputs.chain != 'true'
        run: echo "go=${{ inputs.chain_check == 'true' && 'false' || 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: inputs.chain == 'true'
        with:
          sparse-checkout: pressers_v2/tools
      - id: chain
        if: inputs.chain == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 pressers_v2/tools/overnight_chain.py --gate

  extract:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Serialize every extract (cron + manual + chain) so two runs never race
    # on the same per-video files. A newer trigger queues behind the current
    # run. Job-level (it used to be the whole workflow) so the chain job's
    # wait below never holds up the next run.
    concurrency:
      group: pressers-v2
      cancel-in-progress: false
    # 50 min outer cap = 35 min in-script SIGALRM budget + setup + push + Slack.
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pressers_v2/requirements.txt

      # Podcasts & shows come from hoopshype-yt-quotes' podcast rotation, and
      # its ad hoc submissions become one-offs (public repo, no token): only
      # its last three days of output are checked out. A failure here only
      # means no podcasts or yt-quotes one-offs this run.
      - name: Fetch the podcast rotation's quotes (hoopshype-yt-quotes)
        continue-on-error: true
        run: |
          dirs=""
          # its rotation (output/<date>) and the videos submitted ad hoc to it (output/oneoffs/<date>)
          for d in 0 1 2; do
            day=$(date -u -d "-$d day" +%F)
            dirs="$dirs output/$day output/oneoffs/$day"
          done
          git clone --depth 1 --filter=blob:none --sparse --quiet \
            https://github.com/jsierrahoopshype/hoopshype-yt-quotes.git "$RUNNER_TEMP/ytq"
          git -C "$RUNNER_TEMP/ytq" sparse-checkout set $dirs
          ls "$RUNNER_TEMP/ytq/output" || true

      - name: Run presser extractor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EXTRA_VIDEOS: ${{ inputs.extra_videos }}
          FORCE_REPROCESS: ${{ inputs.force }}
          REBUILD_DATES: ${{ inputs.rebuild_dates }}
          YTQ_PODCAST_DIR: ${{ runner.temp }}/ytq/output
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          # Names the slot for the hourly overnight triggers (the hour field
          # "1-10" is a range, so the HHutc naming can't apply). Empty for
          # the two daytime crons and manual runs, which keep their old names.
          PRESSERS_RUN_SLOT: ${{ (github.event.schedule == '23 1-10 * * *' || inputs.chain == 'true') && 'overnight' || '' }}
        run: python pressers_v2/presser_extractor.py

      - name: Mirror output into docs/ for GitHub Pages
        if: always()
        run: |
          mkdir -p docs/pressers_v2
          if [ -d pressers_v2/output ]; then
            # slack_alerted.json is the Slack bookkeeping, not a page
            rsync -a --delete --exclude slack_alerted.json pressers_v2/output/ docs/pressers_v2/
          fi
          if [ ! -f docs/index.md ]; then
            printf '# NBA pressers digest\n\nSee the [pressers v2 archive](pressers_v2/) of processed press conferences.\n' > docs/index.md
          fi

      - name: Commit and push
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pressers_v2/output docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Pressers v2 run: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Up to 4 push attempts. On rejection, rebase onto the remote tip,
          # resolving any conflict in favour of this run's files (-X theirs
          # = the commit being replayed, i.e. ours, during a rebase).
          max_retries=4
          attempt=0
          until git push origin "HEAD:${GITHUB_REF_NAME}"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::Push failed after $max_retries retries; this run's output was not saved."
              exit 1
            fi
            sleep_s=$((attempt * 5))
            echo "Push rejected; retry ${attempt}/${max_retries} after git pull --rebase -X theirs (sleep ${sleep_s}s)"
            sleep "$sleep_s"
            if ! git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "Rebase failed; will retry."
            fi
          done
          echo "Pushed."

      # Slack goes LAST, after the push, so the linked digest is live.
      - name: Post Slack notification
        if: always() && hashFiles('pressers_v2/.slack_payload.json') != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python pressers_v2/slack_notify.py pressers_v2/.slack_payload.json

      # The post above moves the posted video ids from "pending" to "alerted"
      # in slack_alerted.json; save that so no later run posts them again.
      - name: Commit Slack alert state
        if: always() && hashFiles('pressers_v2/.slack_payload.json') != ''
        run: |
          git add pressers_v2/output/slack_alerted.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Slack state unchanged."
            exit 0
          fi
          # [skip ci]: slack_alerted.json is not mirrored into docs/, so a Pages
          # rebuild for this commit would publish identical pages (and used to
          # cancel the still-running build of this run's real output).
          git commit -m "Pressers v2 Slack state: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          attempt=0
          until git push origin "HEAD:${GITHUB_REF_NAME}"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 4 ]; then
              echo "::error::Slack state push failed; the next run may repeat this post."
              exit 1
            fi
            sleep $((attempt * 5))
            if ! git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
            fi
          done
          echo "Pushed Slack state."

  # Overnight self-retrigger (GitHub fires only a few of the hourly overnight
  # crons, the first one usually at 07-08 UTC): any scheduled run that ends
  # between 00:00 and 09:10 UTC (often the late 20:15 cron) and every chain
  # run end by starting the next one with the built-in token (that run waits
  # ~50 min in its gate). Stops when the next run
  # would extract at or after 10:00 UTC, when another chain run is already
  # queued or running, or after two failed runs in a row.
  chain:
    needs: [gate, extract]
    if: always() && (inputs.chain_check == 'true' || ((github.event_name == 'schedule' || inputs.chain == 'true') && needs.gate.outputs.go == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: pressers_v2/tools
      - name: Start the next overnight run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXTRACT_RESULT: ${{ needs.extract.result }}
          CHAIN_FAILURES: ${{ inputs.chain_failures || '0' }}
          CHAIN_REF: ${{ github.ref_name }}
        run: python3 pressers_v2/tools/overnight_chain.py ${{ inputs.chain_check == 'true' && '--check' || '' }}
