name: Pressers section (structured quotes + preview pages)

# Runs after every "Pressers v2 (quotes + clips)" run (and on its own schedule), on its own: that
# workflow, its schedule, the digest, the clip list and Slack are unchanged.
# Reads the per-video JSON the run committed and writes only:
#   data/history/<season>.jsonl          append-only structured quote records
#   data/history/processed-videos.json   which stored videos were read
#   data/structured-fields.json          structured-fields answers for stored videos
#   data/pressers-site-state.json        page hashes + lastmod (sitemap)
#   docs/pressers/                       preview pages (GitHub Pages), the public
#                                        best-quotes JSON (docs/pressers/api/)
# Gemini (GEMINI_API_KEY, same model): only the structured-fields call, and only
# for new videos stored without its answer (processed before the call existed,
# or the extractor's call failed). YouTube captions are tried for new videos only
# (the verbatim check); a blocked runner just skips the check.
on:
  workflow_run:
    workflows: ["Pressers v2 (quotes + clips)"]
    types: [completed]
  # Safety net: workflow_run did not fire after the 2026-10-20 11:37 run. ~50 min
  # after each Pressers v2 slot (06:15, 14:15, 20:15 UTC); a no-op when nothing is new.
  schedule:
    - cron: '7 7 * * *'
    - cron: '7 15 * * *'
    - cron: '7 21 * * *'
  push:
    # TEMPORARY: the PR branch, to re-run the Gemini backfill before the merge. Removed before merging.
    branches: [main, claude/zen-volta-eqkplv]
    paths:
      - 'pressers_v2/structured_quotes.py'
      - 'pressers_v2/pressers_site.py'
      - 'pressers_v2/section_assets/**'
      - '.github/workflows/pressers-section.yml'
  workflow_dispatch:

# Its own group: never queued against (or cancelling) a Pressers v2 run.
concurrency:
  group: pressers-section
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Preview: every page gets noindex. "false" lets eligible pages be indexed.
  PRESSERS_PREVIEW: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main (with the run's pushed output), or the pushed branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pressers_v2/requirements.txt pillow youtube-transcript-api

      - name: Get the headshots (metadata, head-uniform images, team list and logos)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/jsierrahoopshype/nba-headshots "$RUNNER_TEMP/headshots"
          git -C "$RUNNER_TEMP/headshots" sparse-checkout set --no-cone /players/metadata/players_all.json /players/headshots/head-uniform/ /players/headshots/head-uniform-480/ /teams/metadata/ /teams/logos/current/svg/

      - name: Structured quotes (history + public best-quotes JSON)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pressers_v2/structured_quotes.py --headshots "$RUNNER_TEMP/headshots" --gemini

      - name: Pressers pages (preview)
        run: python pressers_v2/pressers_site.py --headshots "$RUNNER_TEMP/headshots"

      - name: Commit and push
        env:
          BRANCH: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data docs/pressers
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Pressers section: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Same retry as the Pressers v2 run. Only data/ and docs/pressers/ are ours,
          # which that run never writes, so a rebase has nothing to conflict on.
          max_retries=4
          attempt=0
          until git push origin "HEAD:${BRANCH}"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::Push failed after $max_retries retries."
              exit 1
            fi
            sleep $((attempt * 5))
            git pull --rebase origin "${BRANCH}" || { git rebase --abort || true; }
          done
          echo "Pushed."
